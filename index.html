.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}

.bmi-result{text-align:center;padding:16px;}

.copy-mini-btn{margin-top:12px;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:'Exo 2',sans-serif;}
.result-text-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:14px;color:var(--text);position:relative;word-break:break-word;}

.static-page{max-width:760px;margin:0 auto;padding:48px 24px;}

.sp-date{font-size:12px;color:var(--muted);margin-bottom:24px;}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:24px 0;}
.contact-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;}

</style>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const AFF = {

  emi:      { text: "Check Your Loan Eligibility →",  url: "#" },

  bmi:      { text: "Get Your Free Health Checkup →", url: "#" },
  password: { text: "Secure Your Accounts Now →",     url: "#" },
};

const TOOLS = [
  { id: "gst",        icon: "🧾", name: "GST Calculator",       category: "India Finance", tag: "🔥 Top" },
  { id: "emi",        icon: "🏦", name: "EMI Calculator",        category: "India Finance", tag: "🔥 Top" },
  { id: "sip",        icon: "📈", name: "SIP Calculator",        category: "India Finance", tag: "💰 Grow" },
  { id: "discount",   icon: "🏷️", name: "Discount Calculator",   category: "Shopping",      tag: "💰 Save" },
  { id: "bmi",        icon: "⚖️", name: "BMI Calculator",        category: "Health",        tag: "" },
  { id: "age",        icon: "🎂", name: "Age Calculator",        category: "Utility",       tag: "" },
  { id: "password",   icon: "🔐", name: "Password Generator",    category: "Security",      tag: "🛡️ Safe" },
  { id: "qr",         icon: "📱", name: "QR Code Generator",     category: "Utility",       tag: "" },
  { id: "wordcount",  icon: "📝", name: "Word Counter",          category: "Text Tools",    tag: "" },
  { id: "case",       icon: "🔤", name: "Case Converter",        category: "Text Tools",    tag: "" },
  { id: "percentage", icon: "💯", name: "Percentage Calculator", category: "Math",          tag: "" },
  { id: "unitconv",   icon: "📐", name: "Unit Converter",        category: "Converters",    tag: "" },
  { id: "colorpick",  icon: "🎨", name: "Color Converter",       category: "Design",        tag: "🎨" },
  { id: "ai_rewrite", icon: "🤖", name: "AI Text Rewriter",      category: "AI Tools",      tag: "⚡ AI" },
  { id: "ai_email",   icon: "✉️", name: "AI Email Writer",       category: "AI Tools",      tag: "⚡ AI" },
];

const CATS = ["All","India Finance","Shopping","Health","Security","Utility","Text Tools","Math","Converters","Design","AI Tools"];

function SmartBtn({ id }) {
  const a = AFF[id];
  if (!a) return null;
  return (
    <a href={a.url} target="_blank" rel="noopener noreferrer" className="smart-btn">
      <span>{a.text}</span>
      <span className="smart-arrow">→</span>
    </a>
  );
}

function ResultCard({label,value,highlight,accent}) {
  return (
    <div className={`result-card ${highlight?"result-highlight":accent?"result-accent":""}`}>
      <div className="result-label">{label}</div>
      <div className="result-value">{value}</div>
    </div>
  );
}

function Slider({label,value,setValue,min,max,step,display}) {
  return (
    <div className="slider-row">
      <div className="slider-label-row"><label>{label}</label><span className="slider-val">{display}</span></div>
      <input type="range" min={min} max={max} step={step} value={value} onChange={e=>setValue(e.target.value)} className="stark-slider" />
    </div>
  );
}

function GSTCalc() {
  const [amount,setAmount]=useState(""); const [rate,setRate]=useState("18"); const [type,setType]=useState("exclusive");
  const n=parseFloat(amount)||0,r=parseFloat(rate)||0;
  const gst=type==="exclusive"?(n*r)/100:n-n*100/(100+r);
  const total=type==="exclusive"?n+gst:n; const base=type==="inclusive"?n-gst:n;
  return (
    <div className="tool-body">
      <div className="input-row"><label>Amount (₹)</label><input type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="Enter amount" /></div>
      <div className="input-row"><label>GST Rate</label>
        <select value={rate} onChange={e=>setRate(e.target.value)}>
          {["0","0.1","0.25","1","1.5","3","5","6","7.5","12","18","28"].map(v=><option key={v} value={v}>{v}%</option>)}
        </select>
      </
