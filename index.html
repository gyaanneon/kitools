<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KiTools.in — Free Online Tools for India</title>
<meta name="description" content="Free online tools for India — GST Calculator, EMI Calculator, SIP Calculator, Password Generator, QR Code Generator and more."/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#050a12;--bg2:#0a1220;--bg3:#0f1a2e;--cyan:#00d4ff;--cyan2:#00a8cc;--gold:#f59e0b;--green:#00ff88;--border:#1a3050;--text:#e2e8f0;--muted:#64748b;--card:#0d1f35;--card2:#0a1828;}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.nav{position:sticky;top:0;z-index:100;background:rgba(5,10,18,0.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--cyan),var(--gold));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 20px rgba(0,212,255,0.4);}
.logo-text{font-family:'Orbitron',monospace;font-weight:900;font-size:18px;color:var(--cyan);letter-spacing:2px;}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:3px;font-family:'Orbitron',monospace;}
.nav-badge{background:linear-gradient(135deg,#1a3a1a,#0d2a0d);border:1px solid var(--green);color:var(--green);padding:4px 12px;border-radius:20px;font-size:11px;font-family:'Orbitron',monospace;animation:pulse-green 2s infinite;}
@keyframes pulse-green{0%,100%{box-shadow:0 0 5px rgba(0,255,136,0.3);}50%{box-shadow:0 0 15px rgba(0,255,136,0.6);}}
.hero{padding:60px 24px 48px;text-align:center;}
.hero-eyebrow{font-family:'Orbitron',monospace;font-size:11px;color:var(--cyan);letter-spacing:4px;margin-bottom:16px;opacity:0.8;}
.hero-title{font-family:'Orbitron',monospace;font-size:clamp(28px,6vw,56px);font-weight:900;color:white;line-height:1.1;margin-bottom:8px;}
.hero-title span{color:var(--cyan);text-shadow:0 0 30px rgba(0,212,255,0.7);}
.hero-sub{color:var(--muted);font-size:16px;margin-bottom:32px;}
.hero-stats{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;}
.stat-num{font-family:'Orbitron',monospace;font-size:24px;font-weight:700;color:var(--cyan);}
.stat-label{font-size:12px;color:var(--muted);letter-spacing:1px;}
.search-section{padding:0 24px 32px;max-width:800px;margin:0 auto;}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;}
#searchInput{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 16px 14px 48px;border-radius:12px;font-size:15px;font-family:'Exo 2',sans-serif;outline:none;}
#searchInput:focus{border-color:var(--cyan);}
.cat-scroll{padding:0 24px 24px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1200px;margin:0 auto;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-btn{white-space:nowrap;padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:13px;cursor:pointer;font-family:'Exo 2',sans-serif;}
.cat-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,0.08);}
.tools-section{padding:0 24px 48px;max-width:1200px;margin:0 auto;}
.section-title{font-family:'Orbitron',monospace;font-size:13px;color:var(--muted);letter-spacing:3px;margin-bottom:20px;}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.tool-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:all 0.25s;position:relative;}
.tool-card:hover,.tool-card.active{border-color:var(--cyan);background:rgba(0,212,255,0.06);box-shadow:0 8px 24px rgba(0,212,255,0.12);}
.tool-icon{font-size:28px;margin-bottom:10px;display:block;}
.tool-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;}
.tool-cat{font-size:11px;color:var(--muted);}
.tool-tag{position:absolute;top:10px;right:10px;font-size:10px;background:rgba(0,212,255,0.12);color:var(--cyan);padding:2px 7px;border-radius:10px;border:1px solid rgba(0,212,255,0.2);}
.panel{margin:0 24px 48px;max-width:1200px;margin-left:auto;margin-right:auto;background:var(--bg3);border:1px solid var(--cyan2);border-radius:16px;overflow:hidden;box-shadow:0 0 40px rgba(0,212,255,0.1);}
.panel-header{background:linear-gradient(135deg,var(--bg2),var(--bg3));padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-title{display:flex;align-items:center;gap:12px;}
.panel-icon{font-size:28px;}
.panel-name{font-family:'Orbitron',monospace;font-size:16px;color:var(--cyan);font-weight:700;}
.panel-cat{font-size:12px;color:var(--muted);margin-top:2px;}
.close-btn{background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.3);color:#ff6b6b;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;}
.panel-body{padding:24px;display:flex;flex-direction:column;gap:16px;}
.input-row{display:flex;flex-direction:column;gap:6px;}
.input-row label{font-size:13px;color:var(--muted);}
.input-row input,.input-row select,.input-row textarea{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-size:14px;font-family:'Exo 2',sans-serif;outline:none;width:100%;}
.input-row input:focus,.input-row select:focus{border-color:var(--cyan);}
.input-row select option{background:var(--bg2);}
.toggle-row{display:flex;gap:8px;flex-wrap:wrap;}
.tog{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:12px;cursor:pointer;font-family:'Exo 2',sans-serif;}
.tog.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,0.1);}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:480px){.results{grid-template-columns:repeat(2,1fr);}}
.res-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.res-card.hl{border-color:var(--cyan);background:rgba(0,212,255,0.06);}
.res-card.ac{border-color:var(--gold);background:rgba(245,158,11,0.06);}
.res-label{font-size:11px;color:var(--muted);margin-bottom:6px;}
.res-value{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:var(--text);}
.res-card.hl .res-value{color:var(--cyan);}
.res-card.ac .res-value{color:var(--gold);}
.slider-row{display:flex;flex-direction:column;gap:8px;}
.slider-top{display:flex;justify-content:space-between;}
.slider-top label{font-size:13px;color:var(--muted);}
.slider-val{font-family:'Orbitron',monospace;font-size:13px;color:var(--cyan);}
input[type=range]{width:100%;accent-color:var(--cyan);}
.primary-btn{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#000;border:none;padding:13px 24px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Exo 2',sans-serif;width:100%;}
.answer-box{background:linear-gradient(135deg,rgba(0,212,255,0.08),rgba(0,212,255,0.04));border:1px solid rgba(0,212,255,0.3);border-radius:10px;padding:16px 20px;font-family:'Orbitron',monospace;font-size:15px;color:var(--cyan);text-align:center;word-break:break-all;}
.pwd-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:monospace;font-size:14px;color:var(--cyan);word-break:break-all;cursor:pointer;position:relative;}
.strength-bar{background:var(--border);border-radius:3px;height:6px;}
.strength-fill{height:6px;border-radius:3px;transition:all 0.3s;}
.qr-center{display:flex;flex-direction:column;align-items:center;gap:12px;}
.qr-center img{border-radius:12px;border:2px solid var(--cyan);padding:8px;background:white;}
.dl-btn{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);color:var(--cyan);padding:8px 20px;border-radius:8px;text-decoration:none;font-size:13px;}
.text-area{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;font-size:14px;font-family:'Exo 2',sans-serif;outline:none;resize:vertical;width:100%;}
.results3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:480px){.results3{grid-template-columns:repeat(2,1fr);}}
.btn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media(max-width:480px){.btn-grid{grid-template-columns:repeat(2,1fr);}}
.case-btn{padding:9px 8px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:12px;cursor:pointer;font-family:monospace;}
.case-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,0.1);}
.result-text{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:14px;color:var(--text);word-break:break-word;position:relative;}
.copy-mini{position:absolute;top:8px;right:8px;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:12px;}
.dual-sel{display:flex;align-items:center;gap:12px;}
.dual-sel select{flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-size:14px;font-family:'Exo 2',sans-serif;outline:none;}
.color-row{display:flex;gap:12px;align-items:center;}
input[type=color]{width:56px;height:44px;border-radius:8px;border:2px solid var(--border);cursor:pointer;background:none;padding:2px;}
.color-prev{height:80px;border-radius:12px;border:1px solid var(--border);}
.color-vals{display:flex;flex-direction:column;gap:8px;}
.color-val-row{display:flex;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer;gap:12px;}
.cv-label{font-family:'Orbitron',monospace;font-size:11px;color:var(--muted);width:36px;}
.cv-val{font-family:monospace;font-size:13px;color:var(--text);flex:1;}
.bmi-result{text-align:center;padding:16px;}
.bmi-score{font-family:'Orbitron',monospace;font-size:56px;font-weight:900;}
.bmi-cat{font-size:18px;font-weight:600;margin-top:4px;}
.check-row{display:flex;gap:20px;flex-wrap:wrap;}
.check-label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;}
.check-label input{accent-color:var(--cyan);}
.coming-soon{background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(79,70,229,0.05));border:1px solid rgba(124,58,237,0.3);border-radius:12px;padding:32px 24px;text-align:center;}
.cs-icon{font-size:48px;margin-bottom:12px;}
.cs-title{font-family:'Orbitron',monospace;font-size:16px;color:#a78bfa;margin-bottom:8px;}
.cs-text{font-size:14px;color:var(--muted);}
.footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;}
.footer-logo{font-family:'Orbitron',monospace;font-size:16px;color:var(--cyan);letter-spacing:3px;margin-bottom:8px;}
.footer-text{font-size:12px;color:var(--muted);}
.footer-links{display:flex;justify-content:center;gap:24px;margin-top:16px;flex-wrap:wrap;}
.footer-link{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:none;}
.footer-link:hover{color:var(--cyan);}
.hidden{display:none!important;}
</style>
</head>
<body>

<nav class="nav">
  <div class="logo" onclick="showHome()">
    <div class="logo-icon">⚡</div>
    <div>
      <div class="logo-text">KITOOLS.IN</div>
      <div class="logo-sub">FREE TOOLS FOR INDIA</div>
    </div>
  </div>
  <div class="nav-badge">🟢 LIVE</div>
</nav>

<div id="homePage">
  <section class="hero">
    <div class="hero-eyebrow">// KITOOLS.IN — TOOLS ENGINE ONLINE</div>
    <h1 class="hero-title">Every Tool You<br><span>Ever Needed.</span></h1>
    <p class="hero-sub">Free. Fast. Built for India.</p>
    <div class="hero-stats">
      <div><div class="stat-num">13+</div><div class="stat-label">TOOLS LIVE</div></div>
      <div><div class="stat-num">100%</div><div class="stat-label">FREE</div></div>
      <div><div class="stat-num">🇮🇳</div><div class="stat-label">INDIA FIRST</div></div>
    </div>
  </section>

  <div class="search-section">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="searchInput" placeholder="Search tools — GST, EMI, QR Code..." oninput="filterTools()"/>
    </div>
  </div>

  <div class="cat-scroll" id="catScroll"></div>

  <div class="tools-section">
    <div class="section-title" id="toolCount">// TOOLS AVAILABLE</div>
    <div class="tools-grid" id="toolsGrid"></div>
  </div>

  <div id="toolPanel" class="hidden">
    <div style="margin:0 24px 48px;max-width:1200px;margin-left:auto;margin-right:auto;background:var(--bg3);border:1px solid var(--cyan2);border-radius:16px;overflow:hidden;box-shadow:0 0 40px rgba(0,212,255,0.1);">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-icon" id="panelIcon"></span>
          <div>
            <div class="panel-name" id="panelName"></div>
            <div class="panel-cat" id="panelCat"></div>
          </div>
        </div>
        <button class="close-btn" onclick="closeTool()">✕</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-logo">⚡ KITOOLS.IN</div>
  <div class="footer-text">Free tools for everyone. Made in India 🇮🇳</div>
  <div class="footer-links">
    <span class="footer-link">About</span>
    <span class="footer-link">Privacy Policy</span>
    <span class="footer-link">Contact</span>
  </div>
</footer>

<script>
const TOOLS = [
  {id:"gst",   icon:"🧾", name:"GST Calculator",       cat:"India Finance", tag:"🔥 Top"},
  {id:"emi",   icon:"🏦", name:"EMI Calculator",        cat:"India Finance", tag:"🔥 Top"},
  {id:"sip",   icon:"📈", name:"SIP Calculator",        cat:"India Finance", tag:"💰 Grow"},
  {id:"disc",  icon:"🏷️", name:"Discount Calculator",   cat:"Shopping",      tag:"💰 Save"},
  {id:"bmi",   icon:"⚖️", name:"BMI Calculator",        cat:"Health",        tag:""},
  {id:"age",   icon:"🎂", name:"Age Calculator",        cat:"Utility",       tag:""},
  {id:"pwd",   icon:"🔐", name:"Password Generator",    cat:"Security",      tag:"🛡️ Safe"},
  {id:"qr",    icon:"📱", name:"QR Code Generator",     cat:"Utility",       tag:""},
  {id:"word",  icon:"📝", name:"Word Counter",          cat:"Text Tools",    tag:""},
  {id:"case",  icon:"🔤", name:"Case Converter",        cat:"Text Tools",    tag:""},
  {id:"pct",   icon:"💯", name:"Percentage Calculator", cat:"Math",          tag:""},
  {id:"unit",  icon:"📐", name:"Unit Converter",        cat:"Converters",    tag:""},
  {id:"color", icon:"🎨", name:"Color Converter",       cat:"Design",        tag:"🎨"},
  {id:"ai1",   icon:"🤖", name:"AI Text Rewriter",      cat:"AI Tools",      tag:"⚡ AI"},
  {id:"ai2",   icon:"✉️", name:"AI Email Writer",       cat:"AI Tools",      tag:"⚡ AI"},
];

const CATS = ["All","India Finance","Shopping","Health","Security","Utility","Text Tools","Math","Converters","Design","AI Tools"];
let activeCat = "All";
let activeTool = null;

// Build category buttons
const catScroll = document.getElementById("catScroll");
CATS.forEach(c => {
  const btn = document.createElement("button");
  btn.className = "cat-btn" + (c === "All" ? " active" : "");
  btn.textContent = c;
  btn.onclick = () => { activeCat = c; document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); filterTools(); };
  catScroll.appendChild(btn);
});

function filterTools() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const filtered = TOOLS.filter(t => (activeCat === "All" || t.cat === activeCat) && (t.name.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q)));
  document.getElementById("toolCount").textContent = `// ${filtered.length} TOOLS AVAILABLE`;
  const grid = document.getElementById("toolsGrid");
  grid.innerHTML = "";
  filtered.forEach(t => {
    const card = document.createElement("div");
    card.className = "tool-card" + (activeTool === t.id ? " active" : "");
    card.innerHTML = (t.tag ? `<span class="tool-tag">${t.tag}</span>` : "") + `<span class="tool-icon">${t.icon}</span><div class="tool-name">${t.name}</div><div class="tool-cat">${t.cat}</div>`;
    card.onclick = () => openTool(t);
    grid.appendChild(card);
  });
}

function openTool(t) {
  activeTool = t.id;
  document.getElementById("panelIcon").textContent = t.icon;
  document.getElementById("panelName").textContent = t.name.toUpperCase();
  document.getElementById("panelCat").textContent = t.cat;
  document.getElementById("toolPanel").classList.remove("hidden");
  renderTool(t.id);
  filterTools();
  setTimeout(() => document.getElementById("toolPanel").scrollIntoView({behavior:"smooth"}), 50);
}

function closeTool() {
  activeTool = null;
  document.getElementById("toolPanel").classList.add("hidden");
  filterTools();
}

function showHome() { window.scrollTo({top:0,behavior:"smooth"}); }

function rc(label, value, cls="") {
  return `<div class="res-card ${cls}"><div class="res-label">${label}</div><div class="res-value">${value}</div></div>`;
}

function renderTool(id) {
  const body = document.getElementById("panelBody");
  body.innerHTML = "";

  if (id === "gst") {
    body.innerHTML = `
      <div class="input-row"><label>Amount (₹)</label><input type="number" id="gAmt" placeholder="Enter amount" oninput="calcGST()"/></div>
      <div class="input-row"><label>GST Rate</label><select id="gRate" onchange="calcGST()">
        ${["0","0.1","0.25","1","1.5","3","5","6","7.5","12","18","28"].map(v=>`<option value="${v}"${v==="18"?" selected":""}>${v}%</option>`).join("")}
      </select></div>
      <div class="toggle-row">
        <button class="tog active" id="gExcl" onclick="setGType('exclusive')">Excl. GST (Add GST)</button>
        <button class="tog" id="gIncl" onclick="setGType('inclusive')">Incl. GST (Extract GST)</button>
      </div>
      <div class="results" id="gResults"><div style="color:var(--muted);font-size:13px;">Enter amount to calculate</div></div>`;
    window._gtype = "exclusive";
  }

  else if (id === "emi") {
    body.innerHTML = `
      <div class="slider-row"><div class="slider-top"><label>Loan Amount (₹)</label><span class="slider-val" id="ePVal">₹5,00,000</span></div><input type="range" min="10000" max="10000000" step="10000" value="500000" oninput="document.getElementById('ePVal').textContent='₹'+parseInt(this.value).toLocaleString('en-IN');calcEMI()" id="eP"/></div>
      <div class="slider-row"><div class="slider-top"><label>Interest Rate (%)</label><span class="slider-val" id="eRVal">8.5%</span></div><input type="range" min="1" max="30" step="0.1" value="8.5" oninput="document.getElementById('eRVal').textContent=this.value+'%';calcEMI()" id="eR"/></div>
      <div class="slider-row"><div class="slider-top"><label>Tenure (months)</label><span class="slider-val" id="eTVal">60 mo</span></div><input type="range" min="6" max="360" step="6" value="60" oninput="document.getElementById('eTVal').textContent=this.value+' mo';calcEMI()" id="eT"/></div>
      <div class="results" id="eResults"></div>`;
    setTimeout(calcEMI, 10);
  }

  else if (id === "sip") {
    body.innerHTML = `
      <div class="slider-row"><div class="slider-top"><label>Monthly SIP (₹)</label><span class="slider-val" id="sMVal">₹5,000</span></div><input type="ra
